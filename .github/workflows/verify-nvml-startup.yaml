name: Verify NVML startup
on:
  push:
    branches: [chore/verify-nvml-startup]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustup component add clippy
      - name: Check formatting
        run: cargo fmt --package cpu-power-exporter --check
      - name: Test CPU power exporter
        run: cargo test -p cpu-power-exporter --locked
      - name: Check CPU power exporter with clippy
        run: cargo clippy -p cpu-power-exporter --all-targets --locked -- -D warnings
